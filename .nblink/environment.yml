name: plan6068-pv-notebook-link
channels:
  - https://prefix.dev/emscripten-forge-4x
  - https://prefix.dev/conda-forge
dependencies:
  # Notebook.link runs in a WASM environment, so this is a presentation-focused
  # subset of requirements.txt rather than the full local research stack.
  - xeus-python
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - plotly
  - folium
  - geopandas
  - ipywidgets
  - lonboard
  - pillow
  - openpyxl
  - requests
  - pip
  - pip:
      - nest_asyncio
      - pystac
      - pystac-client
      - python-dotenv
      - termcolor
      - tqdm